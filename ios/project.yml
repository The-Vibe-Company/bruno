# Le projet Xcode est généré : `xcodegen generate` dans ce dossier. On ne commite pas le .xcodeproj.
name: Bruno
options:
  bundleIdPrefix: co.thevibecompany
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bruno:
    type: application
    platform: iOS
    sources:
      - path: Bruno
    dependencies:
      - target: BrunoWidget
        embed: true
    entitlements:
      path: Bruno/Bruno.entitlements
      properties:
        com.apple.security.application-groups: [group.co.thevibecompany.bruno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.thevibecompany.bruno
        PROVISIONING_PROFILE_SPECIFIER: "$(BRUNO_APP_PROFILE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Bruno/Info.plist
      properties:
        CFBundleDisplayName: Bruno
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Bruno écoute pour capturer une idée à la voix."
        NSSpeechRecognitionUsageDescription: "Bruno transcrit ce que tu dis — sur l'iPhone quand c'est possible."
        # Le serveur de développement tourne sur le Mac, en http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # bruno://capture — ce que le widget ouvre.
        CFBundleURLTypes:
          - CFBundleURLName: co.thevibecompany.bruno
            CFBundleURLSchemes: [bruno]
  BrunoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BrunoWidget
      - path: Bruno/Partage/Partage.swift
    entitlements:
      path: BrunoWidget/BrunoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.co.thevibecompany.bruno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.thevibecompany.bruno.widget
        PROVISIONING_PROFILE_SPECIFIER: "$(BRUNO_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Bruno
    info:
      path: BrunoWidget/Info.plist
      properties:
        CFBundleDisplayName: Bruno
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
