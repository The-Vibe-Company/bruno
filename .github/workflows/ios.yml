name: iOS

on:
  pull_request:
    paths: ['ios/**', 'scripts/testflight.sh', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'scripts/testflight.sh', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilation iOS Release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1
        with:
          version: '5.3.2'
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - run: >-
          asc xcode build --project ios/Bruno.xcodeproj --scheme Bruno
          --configuration Release --destination 'generic/platform=iOS'
          --no-code-signing --xcodebuild-flag=-quiet

  testflight:
    name: Publication TestFlight
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: bruno-testflight
      cancel-in-progress: false
    env:
      ASC_BYPASS_KEYCHAIN: '1'
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TESTFLIGHT_GROUP_ID: ${{ vars.TESTFLIGHT_GROUP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1
        with:
          version: '5.3.2'
      - run: brew install xcodegen
      - name: Installer la signature dans un trousseau temporaire
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ASC_APP_ID APPLE_TEAM_ID TESTFLIGHT_GROUP_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64 APPLE_CERTIFICATE_P12_B64 APPLE_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuration manquante : $name"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/bruno-signing"
          export ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/bruno-signing/AuthKey.p8"
          echo "ASC_PRIVATE_KEY_PATH=$ASC_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$ASC_PRIVATE_KEY_PATH"
          printf '%s' "$APPLE_CERTIFICATE_P12_B64" | base64 --decode > "$RUNNER_TEMP/bruno-signing/certificate.p12"
          keychain="$RUNNER_TEMP/bruno-signing/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/bruno-signing/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
      - name: Archiver et distribuer avec asc
        run: bash scripts/testflight.sh
      - name: Effacer les secrets temporaires
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bruno-signing/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/bruno-signing"
